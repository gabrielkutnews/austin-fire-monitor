name: Austin Fire Monitor
on:
  schedule:
    - cron: '0 * * * *'        # hourly BACKSTOP only — loop.sh owns the cadence
  workflow_dispatch: {}        # manual trigger + how the loop chains itself

concurrency:                   # one loop at a time; next run starts when this exits
  group: austin-fire-monitor
  cancel-in-progress: false

permissions:
  contents: write              # commit state.json back
  actions: write               # let loop.sh self-trigger the next run

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # loop exits at 340 min; buffer before the 6h cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Poll loop (every ~5 min for ~5h40m, then chain the next run)
        env:
          # Each secret mapped by name — never toJSON(secrets), which dumps the
          # whole secret set into one env var and trips GitHub's malicious-
          # workflow heuristic (it's the standard exfiltration pattern).
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_IDS: ${{ secrets.SLACK_USER_IDS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          GH_TOKEN: ${{ github.token }}          # for `gh workflow run` self-trigger
        run: bash loop.sh
